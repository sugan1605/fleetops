name: FleetOps CI

on:
  push:
    branches:
      - main
      - feature/ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FLEETOPS_DB_HOST: localhost
      FLEETOPS_DB_NAME: fleetops_ci
      FLEETOPS_DB_USER: creativity
      FLEETOPS_DB_PASSWORD: ci-password

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fleetops
          POSTGRES_USER: creativity
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creativity -d fleetops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Build Docker image
        run: docker build -t fleetops:ci .

      - name: Initialize database
        run: |
          PGPASSWORD="$FLEETOPS_DB_PASSWORD" psql \
            -h "$FLEETOPS_DB_HOST" \
            -U "$FLEETOPS_DB_USER" \
            -d "$FLEETOPS_DB_NAME" \
            -c "CREATE DATABASE fleetops_test;"

          PGPASSWORD="$FLEETOPS_DB_PASSWORD" psql \
            -h "$FLEETOPS_DB_HOST" \
            -U "$FLEETOPS_DB_USER" \
            -d fleetops_test \
            -f docker/postgres/init.sql

      - name: Run tests
        run: pytest
